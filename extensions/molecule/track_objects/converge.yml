---
- name: "Gather ios_track_objects facts (gathered state)"
  hosts: ios_gathered
  gather_facts: false
  tasks:
    - name: "Gather facts from device"
      cisco.ios.ios_track_objects:
        state: gathered
      register: result

    - name: "Assert gathered facts"
      ansible.builtin.assert:
        that:
          - result.gathered | length == 4
          - result.gathered[0].ip_sla.parameter == "state"
          - result.gathered[1].ip_route.prefix == "192.0.2.0/28"
          - result.gathered[1].ip_route.vrf == "MGMT"
          - result.gathered[2].interface.name == "GigabitEthernet1/0/1"
          - result.gathered[3].boolean_list.objects | length == 2
        quiet: true

    - name: "PASSED: gathered state"
      ansible.builtin.debug:
        msg: "gathered state test passed"

- name: "Merge ios_track_objects configuration (merged state)"
  hosts: ios_merged
  gather_facts: false
  tasks:
    - name: "Merge configuration"
      cisco.ios.ios_track_objects: &merged_config
        config:
          - object_id: 1
            ip_sla:
              operation_id: 1
              parameter: state
            delay:
              down: 120
              up: 180
          - object_id: 3
            interface:
              name: Gi1/0/1
              parameter: line_protocol
          - object_id: 10
            boolean_list:
              operator: and
              objects:
                - object_id: 1
                - object_id: 3
                  negate: true
            delay:
              down: 10
        state: merged
      register: result

    - name: "Assert merged commands match expected"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands == merged_commands
        quiet: true
      vars:
        merged_commands:
          - "track 1 ip sla 1 state"
          - "delay down 120 up 180"
          - "track 3 interface GigabitEthernet1/0/1 line-protocol"
          - "track 10 list boolean and"
          - "object 1"
          - "object 3 not"
          - "delay down 10"

    - name: "Merge configuration — idempotent run"
      cisco.ios.ios_track_objects: *merged_config
      register: result

    - name: "Assert idempotent — no changes on second run"
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.commands == []
        quiet: true

    - name: "PASSED: merged state"
      ansible.builtin.debug:
        msg: "merged state test passed — config applied + idempotency verified"

- name: "Override ios_track_objects configuration (overridden state)"
  hosts: ios_overridden
  gather_facts: false
  tasks:
    - name: "Override configuration"
      cisco.ios.ios_track_objects: &overridden_config
        config:
          - object_id: 1
            ip_sla:
              operation_id: 1
              parameter: state
            delay:
              down: 120
              up: 180
          - object_id: 3
            interface:
              name: Gi1/0/1
              parameter: line_protocol
          - object_id: 10
            boolean_list:
              operator: and
              objects:
                - object_id: 1
                - object_id: 3
                  negate: true
            delay:
              down: 10
        state: overridden
      register: result

    - name: "Assert only the extra configuration is removed"
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands == overridden_commands
        quiet: true
      vars:
        overridden_commands:
          - "no track 2"

    - name: "Override configuration — idempotent run"
      cisco.ios.ios_track_objects: *overridden_config
      register: result

    - name: "Assert idempotent — no changes on second run"
      ansible.builtin.assert:
        that:
          - result.changed == false
        quiet: true

    - name: "PASSED: overridden state"
      ansible.builtin.debug:
        msg: "overridden state test passed — extra configuration removed + idempotency verified"
