---
- ansible.builtin.debug:
    msg: START ios_aaa deleted integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _prepare.yaml
- ansible.builtin.include_tasks: _remove_config.yaml
- block:
    - name: Deleted - prepare
      cisco.ios.ios_aaa:
        config:
          group_servers:
            - type: radius
              name: "{{ group_name }}"
              servers:
                - "{{ server1 }}"
          authentication:
            login:
              - name: "{{ list_name }}"
                methods:
                  - local
        state: merged

    - name: Deleted - what the task names
      register: result
      cisco.ios.ios_aaa:
        config:
          authentication:
            login:
              - name: "{{ list_name }}"
          group_servers:
            - type: radius
              name: "{{ group_name }}"
        state: deleted

    - name: Deleted - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no aaa authentication login ' ~ list_name in result.commands"
          - "'no aaa group server radius ' ~ group_name in result.commands"
          - "'no aaa new-model' not in result.commands"

    - name: Deleted - idempotent
      register: result
      cisco.ios.ios_aaa:
        config:
          authentication:
            login:
              - name: "{{ list_name }}"
        state: deleted

    - name: Deleted - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false
    - name: Deleted - without config (check mode, it would remove every other list), the default lists are kept
      register: result
      check_mode: true
      cisco.ios.ios_aaa:
        state: deleted

    - name: Deleted - assert no default list, and not AAA itself, would be removed
      ansible.builtin.assert:
        that:
          - result.commands | select('search', ' default$') | list | length == 0
          - result.commands | select('search', 'new-model|session-id') | list | length == 0
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
  when: aaa_on | bool
