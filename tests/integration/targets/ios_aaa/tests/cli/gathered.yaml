---
- ansible.builtin.debug:
    msg: START ios_aaa gathered integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _prepare.yaml
- ansible.builtin.include_tasks: _remove_config.yaml
- block:
    - name: Gathered - prepare
      cisco.ios.ios_aaa:
        config:
          group_servers:
            - type: radius
              name: "{{ group_name }}"
              servers:
                - "{{ server1 }}"
          accounting:
            exec:
              - name: "{{ list_name }}"
                record: start-stop
                methods:
                  - "group {{ group_name }}"
        state: merged

    - name: Gathered - read the configuration
      register: result
      cisco.ios.ios_aaa:
        state: gathered

    - name: Gathered - assert
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.gathered.new_model == true
          - (result.gathered.group_servers | selectattr('name', 'equalto', group_name) | first).servers == [server1]
          - (result.gathered.accounting.exec | selectattr('name', 'equalto', list_name) | first).methods == ['group ' ~ group_name]
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
  when: aaa_on | bool
