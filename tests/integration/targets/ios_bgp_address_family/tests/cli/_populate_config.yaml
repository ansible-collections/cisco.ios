---
- ansible.builtin.include_tasks: _initial_vrf_setup.yaml
- ansible.builtin.include_tasks: _ospf_proc_setup.yaml

- name: Enable routing
  cisco.ios.ios_config:
    lines:
      - ip routing
      - ipv6 unicast-routing

- name: Configure BGP neighbors using ios_config
  cisco.ios.ios_config:
    lines:
      - router bgp 65000
      - neighbor 10.1.1.1 remote-as 100
      - neighbor 10.1.1.2 remote-as 200
      - neighbor 10.1.1.3 remote-as 200

# Probes device capability and sets the `l2vpn_vpls_supported` fact. Some
# platforms/images used in CI don't have the license required for l2vpn
# vpls (see _check_l2vpn_vpls_support.yaml), so that piece of the baseline
# is populated separately below and skipped gracefully when unsupported.
- ansible.builtin.include_tasks: _check_l2vpn_vpls_support.yaml

- name: Populate BGP address family configuration
  cisco.ios.ios_bgp_address_family:
    config:
      as_number: "65000"
      address_family:
        - afi: ipv4
          safi: multicast
          neighbors:
            - neighbor_address: "10.1.1.1"
              activate: true
              remote_as: "100"
          aggregate_address:
            - address: 192.0.2.1
              netmask: 255.255.255.255
              as_confed_set: true
            - address: 192.0.3.1
              netmask: 255.255.255.255
              as_confed_set: true
          bgp:
            aggregate_timer: 10
            dampening:
              penalty_half_time: 1
              reuse_route_val: 1
              suppress_route_val: 1
              max_suppress: 1
            slow_peer:
              - detection:
                  threshold: 150
          network:
            - address: 198.51.110.10
              mask: 255.255.255.255
              backdoor: true
            - address: 198.51.111.11
              mask: 255.255.255.255
              route_map: test
          default_metric: 12
          distance:
            external: 10
            internal: 10
            local: 100
          table_map:
            name: test_tableMap
            filter: true
        - afi: ipv4
          safi: mdt
          bgp:
            dmzlink_bw: true
            dampening:
              penalty_half_time: 1
              reuse_route_val: 10
              suppress_route_val: 100
              max_suppress: 5
            soft_reconfig_backup: true
        - afi: ipv6
          redistribute:
            - ospf:
                process_id: 124
                match:
                  internal: true
                  externals:
                    type_1: true
                    type_2: true
                  nssa_externals:
                    type_1: true
                    type_2: true
                metric: 10
                route_map: bar
                include_connected: true
        - afi: ipv4
          redistribute:
            - connected:
                metric: 10
            - ospf:
                process_id: 124
            - ospf:
                process_id: 123
                match:
                  internal: true
                  externals:
                    type_1: true
                    type_2: true
                  nssa_externals:
                    type_1: true
                    type_2: true
                metric: 10
                route_map: bar
            - ospfv3:
                process_id: 123
                match:
                  internal: true
                  externals:
                    type_1: true
                    type_2: true
                  nssa_externals:
                    type_1: true
                    type_2: true
                metric: 10
                route_map: bar

    state: merged

# l2vpn vpls requires a platform license (e.g. 'ax' on CSR1000v or
# 'network-advantage addon dna-advantage' on Catalyst 8000v/9000). Kept as
# its own call so it can be skipped independently of the rest of the
# baseline on devices/images that lack the license.
- name: Populate l2vpn vpls address family (requires platform license)
  when: l2vpn_vpls_supported
  cisco.ios.ios_bgp_address_family:
    config:
      as_number: "65000"
      address_family:
        - afi: l2vpn
          safi: vpls
          neighbors:
            - neighbor_address: "10.1.1.1"
              activate: true
              remote_as: "100"
    state: merged
