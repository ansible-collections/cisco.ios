---
- ansible.builtin.debug:
    msg: START Replaced ios_bgp_address_family state for integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Replaced provided BGP address family configuration
      register: result
      cisco.ios.ios_bgp_address_family: &id001
        config:
          as_number: 65000
          address_family:
            - afi: ipv4
              redistribute:
                - ospf:
                    process_id: 123
                    match:
                      externals:
                        type_1: true
                      nssa_externals:
                        type_2: true
                    metric: 15
                    route_map: foo
                - ospfv3:
                    process_id: 123
                    match:
                      internal: true
                      externals:
                        type_2: true
                      nssa_externals:
                        type_1: true
                    metric: 15
                    route_map: foo
            - afi: ipv4
              safi: multicast
              aggregate_addresses:
                - address: 192.0.2.1
                  netmask: 255.255.255.255
                  as_confed_set: true
              bgp:
                aggregate_timer: 10
                slow_peer: # slow_peer is deprecated, but let's assume module handles it
                  - detection:
                      threshold: 150
              neighbors:
                - neighbor_address: "10.1.1.3"
                  activate: true
                  remote_as: "200"
              networks:
                - address: 198.51.110.10
                  mask: 255.255.255.255
                  backdoor: true
                - address: 192.0.2.1
                  mask: 255.255.255.255
                  route_map: test
            - afi: ipv6
              safi: unicast
              aggregate_addresses:
                - address: "2001:DB8:1234::/48" # This aggregate will be removed
                  as_set: true
        state: replaced

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - replaced['commands'] | symmetric_difference(result['commands']) | length == 0
        msg: "FAILED: Commands do not match expected."

    - name: Replaced provided BGP address family configuration (idempotent)
      register: result
      cisco.ios.ios_bgp_address_family: *id001

    - name: Assert that task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
        msg: "FAILED: Task was not idempotent."

    - name: Set up neighbor with route-map for regression test
      cisco.ios.ios_config:
        parents:
          - router bgp 65000
          - address-family ipv4
        lines:
          - neighbor 10.1.1.3 activate
          - neighbor 10.1.1.3 route-map AS-PATH-PREPEND out
          - redistribute ospf 123 metric 15 match external 1 nssa-external 2 route-map foo
          - redistribute ospfv3 124 metric 15 match internal external 2 nssa-external 1 route-map foo

    - name: "Regression: replaced with neighbor having no route_maps removes it"
      register: routemap_remove_result
      cisco.ios.ios_bgp_address_family: &routemap_remove
        config:
          as_number: "65000"
          address_family:
            - afi: ipv4
              neighbors:
                - neighbor_address: "10.1.1.3"
                  activate: true
                  remote_as: "200"
        state: replaced

    - name: "Assert: route-map removal command was generated"
      ansible.builtin.assert:
        that:
          - routemap_remove_result['changed'] == true
          - "'no neighbor 10.1.1.3 route-map AS-PATH-PREPEND out' in routemap_remove_result['commands']"
          - "'no redistribute ospf 123' in routemap_remove_result['commands']"
          - "'no redistribute ospfv3 124' in routemap_remove_result['commands']"
        msg: "FAILED: route-map/redistribute negation commands not generated."

    - name: "Regression: idempotency after route-map removal"
      register: routemap_remove_result
      cisco.ios.ios_bgp_address_family: *routemap_remove

    - name: Assert that route-map removal task is idempotent
      ansible.builtin.assert:
        that:
          - routemap_remove_result['changed'] == false
        msg: "FAILED: Task was not idempotent after route-map removal."

    - name: Clean up regression test neighbor config
      cisco.ios.ios_config:
        lines:
          - no router bgp 65000

    # Ensure specifying remote_as for a neighbor that already has it configured at the
    # global BGP level (one leading space in show running-config) does not generate
    # a spurious "neighbor X remote-as Y" command on every run.
    # Tested in isolation (BGP wiped above) so only ONE AF exists on the device;
    # this prevents the multi-AF dict_merge path in state:merged from generating
    # spurious AF blocks that produce a double exit-address-family error.
    - name: "Regression setup: add global neighbor remote-as"
      cisco.ios.ios_config:
        parents:
          - router bgp 65000
        lines:
          - neighbor 10.1.1.3 remote-as 200

    - name: "Regression setup: add ipv4 AF with neighbor activate"
      cisco.ios.ios_config:
        parents:
          - router bgp 65000
          - address-family ipv4 unicast
        lines:
          - neighbor 10.1.1.3 activate

    - name: "Regression: remote_as at global level must be idempotent in AF module (run 1)"
      register: remote_as_result
      cisco.ios.ios_bgp_address_family: &remote_as_idem
        config:
          as_number: "65000"
          address_family:
            - afi: ipv4
              neighbors:
                - neighbor_address: "10.1.1.3"
                  activate: true
                  remote_as: "200"
        state: replaced

    - name: "Assert: run 1 is idempotent when remote_as already configured at global level"
      ansible.builtin.assert:
        that:
          - remote_as_result['changed'] == false
          - remote_as_result['commands'] | default([]) == []
        msg: >-
          FAILED: spurious remote-as command generated: {{ remote_as_result['commands'] | default([]) }}.
          remote_as not captured in have-facts from global BGP section (1 leading space).

    - name: "Regression: remote_as idempotency — run 2"
      register: remote_as_result2
      cisco.ios.ios_bgp_address_family: *remote_as_idem

    - name: "Assert: run 2 is also idempotent"
      ansible.builtin.assert:
        that:
          - remote_as_result2['changed'] == false
          - remote_as_result2['commands'] | default([]) == []
        msg: "FAILED: run 2 still changed: {{ remote_as_result2['commands'] | default([]) }}"

    - name: Clean up regression AF config
      cisco.ios.ios_config:
        lines:
          - no router bgp 65000

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
