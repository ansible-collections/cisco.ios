---
- ansible.builtin.debug:
    msg: START BMP ios_bgp_global scenarios on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _check_bmp_support.yaml

- name: Remove the probe BGP instance
  cisco.ios.ios_bgp_global:
    state: purged

- block:
    - name: Configure BMP servers and neighbor activation
      register: result
      cisco.ios.ios_bgp_global: &bmp_config
        config:
          as_number: 65000
          bgp:
            log_neighbor_changes: true
          bmp:
            buffer_size: 1024
            initial_refresh:
              delay: 30
            servers:
              - number: 1
                address:
                  host: 192.0.2.10
                  port: 5000
                description: collector one
                failure_retry_delay: 20
                flapping_delay: 120
                initial_delay: 15
                set_ip_dscp: 5
                stats_reporting_period: 60
                activate: true
              - number: 2
                address:
                  host: 192.0.2.11
                  port: 5001
          neighbors:
            - neighbor_address: 192.0.2.1
              remote_as: 65001
              bmp_activate:
                all: true
            - neighbor_address: 192.0.2.2
              remote_as: 65002
              bmp_activate:
                servers: [1, 2]
        state: merged

    - name: Assert that the BMP commands were generated
      ansible.builtin.assert:
        that:
          - result.changed
          - "'bmp buffer-size 1024' in result.commands"
          - "'bmp server 1' in result.commands"
          - "'address 192.0.2.10 port-number 5000' in result.commands"
          - "'set ip dscp 5' in result.commands"
          - "'neighbor 192.0.2.1 bmp-activate all' in result.commands"
          - "'neighbor 192.0.2.2 bmp-activate server 1 server 2' in result.commands"

    - name: Merge the same BMP configuration again
      register: result
      cisco.ios.ios_bgp_global: *bmp_config

    - name: Assert that the BMP configuration is idempotent
      ansible.builtin.assert:
        that:
          - not result.changed

    - name: Gather the BMP configuration
      register: gathered_bmp
      cisco.ios.ios_bgp_global:
        state: gathered

    - name: Assert that the gathered BMP configuration matches
      ansible.builtin.assert:
        that:
          - gathered_bmp.gathered.bmp.servers | length == 2
          - (gathered_bmp.gathered.bmp.servers | first).number == 1
          - (gathered_bmp.gathered.bmp.servers | first).address.host == '192.0.2.10'
          - (gathered_bmp.gathered.bmp.servers | first).description == 'collector one'
          - (gathered_bmp.gathered.bmp.servers | first).activate
          - (gathered_bmp.gathered.neighbors | selectattr('neighbor_address', 'equalto', '192.0.2.1') | first).bmp_activate.all

    - name: Clear all BMP activation with an explicit false value
      register: result
      cisco.ios.ios_bgp_global:
        config:
          as_number: 65000
          neighbors:
            - neighbor_address: 192.0.2.1
              remote_as: 65001
              bmp_activate:
                all: false
        state: merged

    - name: Assert that explicit false removed the neighbor activation
      ansible.builtin.assert:
        that:
          - result.changed
          - "'no neighbor 192.0.2.1 bmp-activate' in result.commands"
          - result.commands | select('match', '^neighbor .* bmp-activate') | list | length == 0

    - name: Change the address of an activated server
      register: result
      cisco.ios.ios_bgp_global:
        config:
          as_number: 65000
          bmp:
            servers:
              - number: 1
                address:
                  host: 192.0.2.50
                  port: 5500
        state: merged

    - name: Assert that the server is deactivated around the address change
      ansible.builtin.assert:
        that:
          - result.commands | select('match', 'no activate') | list | length == 1
          - "'address 192.0.2.50 port-number 5500' in result.commands"
          - "'no address 192.0.2.10 port-number 5000' in result.commands"

    - name: Add a server to the servers a neighbor is activated for
      register: result
      cisco.ios.ios_bgp_global:
        config:
          as_number: 65000
          bgp:
            log_neighbor_changes: true
          neighbors:
            - neighbor_address: 192.0.2.2
              remote_as: 65002
              bmp_activate:
                servers: [3]
        state: merged

    - name: Assert that the old activation is removed first and the servers are united
      ansible.builtin.assert:
        that:
          - result.changed
          - result.commands.index('no neighbor 192.0.2.2 bmp-activate') < result.commands.index('neighbor 192.0.2.2 bmp-activate server 1 server 2 server 3')

    - name: Clear the neighbor activation before deleting a BMP server
      register: result
      cisco.ios.ios_bgp_global:
        config:
          as_number: 65000
          neighbors:
            - neighbor_address: 192.0.2.2
              remote_as: 65002
              bmp_activate:
                all: false
        state: merged

    - name: Assert that the neighbor activation was cleared
      ansible.builtin.assert:
        that:
          - result.changed
          - "'no neighbor 192.0.2.2 bmp-activate' in result.commands"

    - name: Delete only BMP server 2
      register: result
      cisco.ios.ios_bgp_global:
        config:
          as_number: 65000
          bmp:
            servers:
              - number: 2
        state: deleted

    - name: Assert that only the selected BMP server was removed
      ansible.builtin.assert:
        that:
          - result.changed
          - "'no bmp server 1' not in result.commands"

    - name: Gather BMP configuration after targeted deletion
      register: gathered_bmp
      cisco.ios.ios_bgp_global:
        state: gathered

    - name: Assert that BMP server 1 remains configured
      ansible.builtin.assert:
        that:
          - gathered_bmp.gathered.bmp.servers | length == 1
          - (gathered_bmp.gathered.bmp.servers | first).number == 1

    - name: Remove all BMP configuration
      register: result
      cisco.ios.ios_bgp_global:
        config:
          as_number: 65000
        state: deleted

    - name: Assert that the BMP servers were removed
      ansible.builtin.assert:
        that:
          - result.changed
          - "'no bmp server 1' in result.commands"

    - name: Reconfigure BMP before targeted neighbor activation deletion
      register: result
      cisco.ios.ios_bgp_global: *bmp_config

    - name: Delete only BMP activation server 1 from neighbor 2
      register: result
      cisco.ios.ios_bgp_global:
        config:
          as_number: 65000
          neighbors:
            - neighbor_address: 192.0.2.2
              remote_as: 65002
              bmp_activate:
                servers: [1]
        state: deleted

    - name: Assert only the selected neighbor activation server was removed
      ansible.builtin.assert:
        that:
          - result.changed
          - "'no neighbor 192.0.2.2 bmp-activate' in result.commands"
          - "'neighbor 192.0.2.2 bmp-activate server 2' in result.commands"
          - "'neighbor 192.0.2.2 bmp-activate server 1' not in result.commands"

    - name: Reject a BMP description containing a line break
      block:
        - name: Submit a multiline BMP description
          cisco.ios.ios_bgp_global:
            config:
              as_number: 65000
              bmp:
                servers:
                  - number: 4
                    description: |-
                      resolver-probe-first
                      description resolver-probe-second
            state: merged

        - name: Fail if the multiline description was accepted
          ansible.builtin.fail:
            msg: The BMP description line break was accepted.

      rescue:
        - name: Assert the invalid value was rejected before device configuration
          ansible.builtin.assert:
            that:
              - "'BMP server 4 option description' in ansible_failed_result.msg"

    - name: Reject a neighbor address containing a line break
      block:
        - name: Render BMP activation for a multiline neighbor address
          cisco.ios.ios_bgp_global:
            config:
              as_number: 65000
              neighbors:
                - neighbor_address: |-
                    192.0.2.99
                    neighbor 192.0.2.1
                  remote_as: 65099
                  bmp_activate:
                    all: true
            state: rendered

        - name: Fail if the multiline neighbor address was accepted
          ansible.builtin.fail:
            msg: The multiline neighbor address was accepted.

      rescue:
        - name: Assert the invalid neighbor address was rejected
          ansible.builtin.assert:
            that:
              - "'Neighbor address must not contain carriage returns or line feeds' in ansible_failed_result.msg"
  when: bmp_supported
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
