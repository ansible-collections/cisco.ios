---
- ansible.builtin.debug:
    msg: START ios_bgp_global peer-group declaration integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- block:
    - name: Merge multiple peer-group declarations and member assignments
      register: result
      cisco.ios.ios_bgp_global: &peer_group_config
        config:
          as_number: 65000
          neighbors:
            - neighbor_address: 192.0.2.254
              peer_group: TestGroup
            - neighbor_address: 192.0.2.253
              peer_group: BackupGroup
            - neighbor_address: TestGroup
              peer_group_declaration: true
              remote_as: "65001"
            - neighbor_address: BackupGroup
              peer_group_declaration: true
              remote_as: "65002"
        state: merged

    - name: Assert declarations precede assignments and commands are ordered correctly
      ansible.builtin.assert:
        that:
          - peer_group_declaration['commands'] == result['commands']

    - name: Assert that before dict is correctly generated
      ansible.builtin.assert:
        that:
          - peer_group_declaration['before'] == result['before']

    - name: Assert peer-group after values are correctly generated
      ansible.builtin.assert:
        that:
          - peer_group_declaration['after']['as_number'] == result['after']['as_number']
          - peer_group_declaration['after']['bgp']['default'] == result['after']['bgp']['default']
          - peer_group_declaration['after']['neighbors'] == result['after']['neighbors']

    - name: Merge multiple peer-group declarations and member assignments (idempotent)
      register: result
      cisco.ios.ios_bgp_global: *peer_group_config

    - name: Assert merge is idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false

    - name: Gather multiple peer-group declarations and member assignments
      cisco.ios.ios_bgp_global:
        state: gathered
      register: gathered_result

    - name: Assert multiple declaration booleans and assignment strings are gathered
      ansible.builtin.assert:
        that:
          - gathered_result.changed == false
          - (gathered_result.gathered.neighbors | selectattr('neighbor_address', 'equalto', 'TestGroup') | list | first).peer_group_declaration is sameas true
          - (gathered_result.gathered.neighbors | selectattr('neighbor_address', 'equalto', 'BackupGroup') | list | first).peer_group_declaration is sameas true
          - (gathered_result.gathered.neighbors | selectattr('neighbor_address', 'equalto', '192.0.2.254') | list | first).peer_group == 'TestGroup'
          - (gathered_result.gathered.neighbors | selectattr('neighbor_address', 'equalto', '192.0.2.253') | list | first).peer_group == 'BackupGroup'

    - name: Remove peer-group declaration with false
      cisco.ios.ios_bgp_global:
        config:
          as_number: 65000
          neighbors:
            - neighbor_address: TestGroup
              peer_group_declaration: false
        state: merged
      register: removed

    - name: Assert false removes the peer-group declaration
      ansible.builtin.assert:
        that:
          - removed.changed
          - "'no neighbor TestGroup peer-group' in removed.commands"

    - name: Repeat peer-group removal (idempotent)
      cisco.ios.ios_bgp_global:
        config:
          as_number: 65000
          neighbors:
            - neighbor_address: TestGroup
              peer_group_declaration: false
        state: merged
      register: removal_idempotent

    - name: Assert removal is idempotent
      ansible.builtin.assert:
        that:
          - removal_idempotent.changed == false

    - name: Verify IOS removed peer-group and member configuration
      cisco.ios.ios_command:
        commands:
          - show running-config | section ^router bgp 65000
      register: after_removal

    - name: Assert peer-group and member are absent
      ansible.builtin.assert:
        that:
          - "'TestGroup' not in after_removal.stdout[0]"
          - "'192.0.2.254' not in after_removal.stdout[0]"
          - "'BackupGroup' in after_removal.stdout[0]"
          - "'192.0.2.253' in after_removal.stdout[0]"
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
