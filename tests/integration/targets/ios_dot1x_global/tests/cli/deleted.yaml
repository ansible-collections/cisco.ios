---
- ansible.builtin.debug:
    msg: START ios_dot1x_global deleted integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _prepare.yaml
- block:
    - name: Deleted - prepare
      cisco.ios.ios_dot1x_global:
        config:
          critical_eapol: true
          authentication:
            mac_move:
              permit: true
        state: merged

    - name: Deleted - all the options go back to their default, only on a device where 802.1X is off
      register: result
      cisco.ios.ios_dot1x_global:
        state: deleted
      when: not keep_system_auth_control | bool

    - name: Deleted - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no dot1x critical eapol' in result.commands"
          - "'no authentication mac-move permit' in result.commands"
      when: not keep_system_auth_control | bool

    - name: Deleted - idempotent
      register: result
      cisco.ios.ios_dot1x_global:
        state: deleted
      when: not keep_system_auth_control | bool

    - name: Deleted - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false
      when: not keep_system_auth_control | bool
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
