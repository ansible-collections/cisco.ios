---
- ansible.builtin.debug:
    msg: START ios_dot1x_interfaces deleted integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _prepare.yaml
- block:
    - name: Deleted - prepare
      cisco.ios.ios_dot1x_interfaces:
        config:
          - name: "{{ dot1x_port1 }}"
            mab: true
            authentication:
              periodic: true
          - name: "{{ dot1x_port2 }}"
            mab: true
        state: merged

    - name: Deleted - one port
      register: result
      cisco.ios.ios_dot1x_interfaces:
        config:
          - name: "{{ dot1x_port1 }}"
        state: deleted

    - name: Deleted - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands == ['interface ' ~ dot1x_port1, 'no authentication periodic', 'no mab']

    - name: Deleted - idempotent
      register: result
      cisco.ios.ios_dot1x_interfaces:
        config:
          - name: "{{ dot1x_port1 }}"
        state: deleted

    - name: Deleted - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
