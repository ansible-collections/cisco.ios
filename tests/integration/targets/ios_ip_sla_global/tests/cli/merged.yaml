---
- ansible.builtin.debug:
    msg: START ios_ip_sla_global merged integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- block:
    - name: Merged - create operations
      register: result
      cisco.ios.ios_ip_sla_global: &create
        config:
          logging_traps: true
          operations:
            - operation_id: 91
              icmp_echo:
                destination: "{{ sla_dest1 }}"
              frequency: 10
              timeout: 6000
              schedule:
                life: forever
                start_time: now
            - operation_id: 92
              http:
                method: raw
                url: "{{ sla_url }}"
                raw_request: "{{ sla_raw_request }}"
              threshold: 500
        state: merged

    - name: Merged - assert changed
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'ip sla 91' in result.commands"
          - "'icmp-echo ' ~ sla_dest1 in result.commands"
          - "'ip sla schedule 91 life forever start-time now' in result.commands"
          - "'ip sla 92' in result.commands"

    - name: Merged - idempotent
      register: result
      cisco.ios.ios_ip_sla_global: *create

    - name: Merged - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false

    - name: Merged - only change the frequency, everything else is kept
      register: result
      cisco.ios.ios_ip_sla_global:
        config:
          operations:
            - operation_id: 91
              frequency: 20
        state: merged

    - name: Merged - assert only the frequency was sent
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands == ['ip sla 91', 'frequency 20']
          - result.after.operations | selectattr('operation_id', 'equalto', 91) | map(attribute='timeout') | first == 6000
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
