---
- ansible.builtin.debug:
    msg: START ios_ip_sla_global replaced integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Replaced - drop the frequency and the schedule of operation 91
      register: result
      cisco.ios.ios_ip_sla_global: &replace
        config:
          logging_traps: true
          operations:
            - operation_id: 91
              icmp_echo:
                destination: "{{ sla_dest1 }}"
              timeout: 3000
        state: replaced

    - name: Replaced - assert dropped options were negated
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no frequency' in result.commands"
          - "'timeout 3000' in result.commands"
          - "'no ip sla schedule 91' in result.commands"
          - result.after.operations | selectattr('operation_id', 'equalto', 92) | list | length == 1

    - name: Replaced - idempotent
      register: result
      cisco.ios.ios_ip_sla_global: *replace

    - name: Replaced - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false

    - name: Replaced - change the operation type
      register: result
      cisco.ios.ios_ip_sla_global:
        config:
          logging_traps: true
          operations:
            - operation_id: 92
              tcp_connect:
                destination: "{{ sla_dest2 }}"
                port: 443
        state: replaced

    - name: Replaced - assert the operation was recreated
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands[:2] == ['no ip sla 92', 'ip sla 92']
          - "'tcp-connect ' ~ sla_dest2 ~ ' 443' in result.commands"
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
