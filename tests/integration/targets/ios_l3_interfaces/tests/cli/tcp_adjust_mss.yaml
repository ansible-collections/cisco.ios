---
- ansible.builtin.debug:
    msg: START TCP adjust-mss ios_l3_interfaces scenarios on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- block:
    - name: Configure the TCP MSS for IPv4 and IPv6
      register: result
      cisco.ios.ios_l3_interfaces: &mss_config
        config:
          - name: Loopback999
            ipv4:
              - address: 192.0.2.1/24
            tcp_adjust_mss: 1400
            ipv6_tcp_adjust_mss: 1380
        state: merged

    - name: Assert that the TCP MSS commands were generated
      ansible.builtin.assert:
        that:
          - result.changed
          - "'ip tcp adjust-mss 1400' in result.commands"
          - "'ipv6 tcp adjust-mss 1380' in result.commands"

    - name: Configure the same TCP MSS again
      register: result
      cisco.ios.ios_l3_interfaces: *mss_config

    - name: Assert that the TCP MSS configuration is idempotent
      ansible.builtin.assert:
        that:
          - not result.changed

    - name: Gather the TCP MSS configuration
      register: gathered
      cisco.ios.ios_l3_interfaces:
        state: gathered

    - name: Assert that the gathered TCP MSS values match
      ansible.builtin.assert:
        that:
          - (gathered.gathered | selectattr('name', 'equalto', 'Loopback999') | first).tcp_adjust_mss == 1400
          - (gathered.gathered | selectattr('name', 'equalto', 'Loopback999') | first).ipv6_tcp_adjust_mss == 1380

    - name: Change the IPv4 TCP MSS in place
      register: result
      cisco.ios.ios_l3_interfaces:
        config:
          - name: Loopback999
            tcp_adjust_mss: 1300
        state: merged

    - name: Assert that only the changed value is sent
      ansible.builtin.assert:
        that:
          - result.commands | length == 2
          - "'ip tcp adjust-mss 1300' in result.commands"

    - name: Replace the interface configuration without the IPv6 TCP MSS
      register: result
      cisco.ios.ios_l3_interfaces:
        config:
          - name: Loopback999
            ipv4:
              - address: 192.0.2.1/24
            tcp_adjust_mss: 1300
        state: replaced

    - name: Assert that the dropped IPv6 TCP MSS is removed and the IPv4 one is kept
      ansible.builtin.assert:
        that:
          - "'no ipv6 tcp adjust-mss 1380' in result.commands"
          - "'no ip tcp adjust-mss 1300' not in result.commands"

    - name: Delete the interface configuration
      register: result
      cisco.ios.ios_l3_interfaces:
        config:
          - name: Loopback999
        state: deleted

    - name: Assert that the TCP MSS was removed
      ansible.builtin.assert:
        that:
          - "'no ip tcp adjust-mss 1300' in result.commands"
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
