---
- name: Populate base ERSPAN monitor session configuration
  cisco.ios.ios_monitor_sessions:
    config:
      - session: 1
        session_type: erspan-source
        sources:
          - interfaces:
              - "{{ monitor_if1 }}"
        destination:
          erspan_id: "{{ erspan_id }}"
          ip_address: "{{ erspan_ip }}"
          origin_ip_address: "{{ erspan_origin }}"
    state: merged
