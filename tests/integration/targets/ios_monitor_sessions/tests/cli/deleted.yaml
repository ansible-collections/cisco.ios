---
- ansible.builtin.debug:
    msg: START ios_monitor_sessions deleted integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- block:
    - name: Ios_monitor_sessions deleted - populate two sessions
      cisco.ios.ios_monitor_sessions:
        config:
          - session: 1
            session_type: erspan-source
            sources:
              - interfaces:
                  - "{{ monitor_if1 }}"
            destination:
              erspan_id: "{{ erspan_id }}"
              ip_address: "{{ erspan_ip }}"
              origin_ip_address: "{{ erspan_origin }}"
          - session: 2
            session_type: erspan-source
            sources:
              - interfaces:
                  - "{{ monitor_if2 }}"
            destination:
              erspan_id: "{{ erspan_id_alt }}"
              ip_address: "{{ erspan_ip_alt }}"
              origin_ip_address: "{{ erspan_origin_alt }}"
        state: merged

    - name: Ios_monitor_sessions deleted - delete specific session
      register: result
      cisco.ios.ios_monitor_sessions:
        config:
          - session: 1
        state: deleted

    - name: Ios_monitor_sessions deleted - assert session 1 removed
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no monitor session 1' in result.commands"
          - "'no monitor session 2' not in result.commands"

    - name: Ios_monitor_sessions deleted - delete all sessions
      register: result
      cisco.ios.ios_monitor_sessions:
        state: deleted

    - name: Ios_monitor_sessions deleted - assert all sessions removed
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no monitor session 2' in result.commands"

    - name: Ios_monitor_sessions deleted - idempotent on empty device
      register: result
      cisco.ios.ios_monitor_sessions:
        state: deleted

    - name: Ios_monitor_sessions deleted - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
