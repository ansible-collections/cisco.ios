---
- ansible.builtin.debug:
    msg: START ios_monitor_sessions gathered integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- block:
    - name: Ios_monitor_sessions gathered - populate sources
      cisco.ios.ios_monitor_sessions:
        config:
          - session: 1
            session_type: erspan-source
            sources:
              - interfaces:
                  - "{{ monitor_if1 }}"
                  - "{{ monitor_if2 }}"
                  - "{{ monitor_if3 }}"
            destination:
              erspan_id: "{{ erspan_id }}"
              ip_address: "{{ erspan_ip }}"
              origin_ip_address: "{{ erspan_origin }}"
        state: merged

    - name: Ios_monitor_sessions gathered - gather facts
      register: result
      cisco.ios.ios_monitor_sessions:
        state: gathered

    - name: Ios_monitor_sessions gathered - assert individual interfaces returned
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.gathered | length == 1
          - result.gathered[0].session == 1
          - result.gathered[0].session_type == "erspan-source"
          - result.gathered[0].destination.ip_address == erspan_ip

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
