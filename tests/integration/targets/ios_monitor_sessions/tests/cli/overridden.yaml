---
- ansible.builtin.debug:
    msg: START ios_monitor_sessions overridden integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- block:
    - name: Ios_monitor_sessions overridden - populate two sessions
      cisco.ios.ios_monitor_sessions:
        config:
          - session: 1
            sources:
              - interfaces:
                  - Gi1/0/1
                  - Gi1/0/2
            destination:
              interface: Gi1/0/10
          - session: 2
            sources:
              - interfaces:
                  - Gi1/0/3
            destination:
              interface: Gi1/0/9
        state: merged

    - name: Ios_monitor_sessions overridden - keep session 1 with fewer sources, drop session 2
      register: result
      cisco.ios.ios_monitor_sessions: &id001
        config:
          - session: 1
            sources:
              - interfaces:
                  - Gi1/0/1
            destination:
              interface: Gi1/0/10
        state: overridden

    - name: Ios_monitor_sessions overridden - assert extra source and session removed
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no monitor session 1 source interface Gi1/0/2' in result.commands"
          - "'no monitor session 2' in result.commands"
          - "'no monitor session 1 source interface Gi1/0/1' not in result.commands"

    - name: Ios_monitor_sessions overridden - idempotent
      register: result
      cisco.ios.ios_monitor_sessions: *id001

    - name: Ios_monitor_sessions overridden - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
