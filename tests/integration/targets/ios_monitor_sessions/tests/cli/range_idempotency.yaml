---
- ansible.builtin.debug:
    msg: START ios_monitor_sessions range idempotency integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- block:
    - name: Ios_monitor_sessions range idempotency - populate with individual interfaces
      cisco.ios.ios_monitor_sessions:
        config:
          - session: 1
            session_type: erspan-source
            sources:
              - interfaces:
                  - "{{ monitor_if1 }}"
                  - "{{ monitor_if2 }}"
            destination:
              erspan_id: "{{ erspan_id }}"
              ip_address: "{{ erspan_ip }}"
              origin_ip_address: "{{ erspan_origin }}"
        state: merged

    - name: Ios_monitor_sessions range idempotency - re-apply same config
      register: result
      cisco.ios.ios_monitor_sessions:
        config:
          - session: 1
            session_type: erspan-source
            sources:
              - interfaces:
                  - "{{ monitor_if1 }}"
                  - "{{ monitor_if2 }}"
            destination:
              erspan_id: "{{ erspan_id }}"
              ip_address: "{{ erspan_ip }}"
              origin_ip_address: "{{ erspan_origin }}"
        state: merged

    - name: Ios_monitor_sessions range idempotency - assert idempotent even if device stored as range
      ansible.builtin.assert:
        that:
          - result.changed == false

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
