---
- ansible.builtin.debug:
    msg: START ios_monitor_sessions replaced integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- block:
    - name: Ios_monitor_sessions replaced - populate
      cisco.ios.ios_monitor_sessions:
        config:
          - session: 1
            sources:
              - interfaces:
                  - "{{ test_interface }}"
                  - "{{ test_interface2 }}"
            destination:
              interface: "{{ monitor_dest }}"
        state: merged

    - name: Ios_monitor_sessions replaced - swap sources
      register: result
      cisco.ios.ios_monitor_sessions: &id001
        config:
          - session: 1
            sources:
              - interfaces:
                  - "{{ test_interface2 }}"
                  - "{{ monitor_if_src3 }}"
            destination:
              interface: "{{ monitor_dest }}"
        state: replaced

    - name: Ios_monitor_sessions replaced - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no monitor session 1 source interface ' + test_interface in result.commands"
          - "'monitor session 1 source interface ' + monitor_if_src3 in result.commands"
          - "'no monitor session 1 source interface ' + test_interface2 not in result.commands"

    - name: Ios_monitor_sessions replaced - idempotent
      register: result
      cisco.ios.ios_monitor_sessions: *id001

    - name: Ios_monitor_sessions replaced - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
