---
- ansible.builtin.debug:
    msg: START ios_monitor_sessions replaced integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml

- block:
    - name: Ios_monitor_sessions replaced - populate
      cisco.ios.ios_monitor_sessions:
        config:
          - session: 1
            sources:
              - interfaces:
                  - Gi1/0/1
                  - Gi1/0/2
            destination:
              interface: Gi1/0/10
        state: merged

    - name: Ios_monitor_sessions replaced - swap sources
      register: result
      cisco.ios.ios_monitor_sessions: &id001
        config:
          - session: 1
            sources:
              - interfaces:
                  - Gi1/0/2
                  - Gi1/0/3
            destination:
              interface: Gi1/0/10
        state: replaced

    - name: Ios_monitor_sessions replaced - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no monitor session 1 source interface Gi1/0/1' in result.commands"
          - "'monitor session 1 source interface Gi1/0/3' in result.commands"
          - "'no monitor session 1 source interface Gi1/0/2' not in result.commands"

    - name: Ios_monitor_sessions replaced - idempotent
      register: result
      cisco.ios.ios_monitor_sessions: *id001

    - name: Ios_monitor_sessions replaced - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
