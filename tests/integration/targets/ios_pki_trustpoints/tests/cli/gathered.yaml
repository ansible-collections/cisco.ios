---
- ansible.builtin.debug:
    msg: START ios_pki_trustpoints gathered integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- block:
    - name: Gathered - prepare
      cisco.ios.ios_pki_trustpoints:
        config:
          - name: "{{ web_name }}"
            enrollment:
              type: terminal
            revocation_check:
              - crl
              - none
            hash: sha384
        state: merged

    - name: Gathered - read the configuration
      register: result
      cisco.ios.ios_pki_trustpoints:
        state: gathered

    - name: Gathered - assert
      ansible.builtin.assert:
        that:
          - result.changed == false
          - (result.gathered | selectattr('name', 'equalto', web_name) | first).revocation_check == ['crl', 'none']
          - (result.gathered | selectattr('name', 'equalto', web_name) | first).hash == 'sha384'
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
