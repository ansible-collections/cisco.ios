---
- ansible.builtin.debug:
    msg: START ios_pki_trustpoints left_alone integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- name: Left alone - the trustpoints of the device before
  register: before
  cisco.ios.ios_pki_trustpoints:
    state: gathered

- block:
    - name: Left alone - change a trustpoint of the tests
      cisco.ios.ios_pki_trustpoints:
        config:
          - name: "{{ web_name }}"
            enrollment:
              type: terminal
        state: replaced

    - name: Left alone - the trustpoints of the device after
      register: after
      cisco.ios.ios_pki_trustpoints:
        state: gathered

    - name: Left alone - assert nothing else changed
      ansible.builtin.assert:
        that:
          - after.gathered | rejectattr('name', 'equalto', web_name) | list == before.gathered
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
