---
- ansible.builtin.debug:
    msg: START ios_pki_trustpoints rendered integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- name: Rendered - render commands without device
  register: result
  cisco.ios.ios_pki_trustpoints:
    config:
      - name: "{{ web_name }}"
        enrollment:
          type: selfsigned
        hash: sha256
    state: rendered

- name: Rendered - assert commands generated
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.rendered == ['crypto pki trustpoint ' ~ web_name, 'enrollment selfsigned', 'hash sha256']
