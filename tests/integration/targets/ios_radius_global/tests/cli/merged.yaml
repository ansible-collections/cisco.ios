---
- ansible.builtin.debug:
    msg: START ios_radius_global merged integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- block:
    - name: Merged - create the servers and the global options
      register: result
      cisco.ios.ios_radius_global: &create
        config:
          timeout: 7
          retransmit: 4
          deadtime: 2
          dead_criteria:
            time: 8
            tries: 4
          attributes:
            - number: 8
              include_in_access_req: true
          servers:
            - name: "{{ server1 }}"
              address:
                ipv4: "{{ server1_address }}"
                auth_port: 1812
                acct_port: 1813
              key:
                type: 0
                value: example-secret
              timeout: 3
            - name: "{{ server2 }}"
              address:
                ipv4: "{{ server2_address }}"
        state: merged

    - name: Merged - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'radius-server timeout 7' in result.commands"
          - "'radius-server dead-criteria time 8 tries 4' in result.commands"
          - "'radius-server attribute 8 include-in-access-req' in result.commands"
          - "'radius server ' ~ server1 in result.commands"
          - "'address ipv4 ' ~ server1_address ~ ' auth-port 1812 acct-port 1813' in result.commands"
          - "'timeout 3' in result.commands"

    - name: Merged - idempotent (a clear text key is not compared with the encrypted one of the device)
      register: result
      cisco.ios.ios_radius_global: *create

    - name: Merged - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false

    - name: Merged - only the timeout of one server, the rest is kept
      register: result
      cisco.ios.ios_radius_global:
        config:
          servers:
            - name: "{{ server1 }}"
              timeout: 9
        state: merged

    - name: Merged - assert
      ansible.builtin.assert:
        that:
          - result.commands == ['radius server ' ~ server1, 'timeout 9']
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
