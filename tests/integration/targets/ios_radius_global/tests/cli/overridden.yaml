---
- ansible.builtin.debug:
    msg: START ios_radius_global overridden integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- block:
    - name: Overridden - prepare, two servers
      cisco.ios.ios_radius_global:
        config:
          servers:
            - name: "{{ server1 }}"
              address:
                ipv4: "{{ server1_address }}"
            - name: "{{ server2 }}"
              address:
                ipv4: "{{ server2_address }}"
        state: merged

    - name: Overridden - gather what the device has, it is part of the wanted configuration
      register: gathered
      cisco.ios.ios_radius_global:
        state: gathered

    - name: Overridden - the wanted servers are the ones of the device without the second test server
      ansible.builtin.set_fact:
        wanted_servers: "{{ gathered.gathered.servers | rejectattr('name', 'equalto', server2) | list }}"

    - name: Overridden - only the second test server goes
      register: result
      cisco.ios.ios_radius_global:
        config: "{{ gathered.gathered | combine({'servers': wanted_servers}) }}"
        state: overridden

    - name: Overridden - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands == ['no radius server ' ~ server2]
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
