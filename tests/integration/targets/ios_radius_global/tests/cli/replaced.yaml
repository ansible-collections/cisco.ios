---
- ansible.builtin.debug:
    msg: START ios_radius_global replaced integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- block:
    - name: Replaced - prepare
      cisco.ios.ios_radius_global:
        config:
          timeout: 7
          servers:
            - name: "{{ server1 }}"
              address:
                ipv4: "{{ server1_address }}"
              timeout: 3
              retransmit: 2
        state: merged

    - name: Replaced - the server is cut down to the task, the other options are set back
      register: result
      cisco.ios.ios_radius_global: &replace
        config:
          timeout: 7
          servers:
            - name: "{{ server1 }}"
              address:
                ipv4: "{{ server1_address }}"
              timeout: 3
        state: replaced

    - name: Replaced - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands == ['radius server ' ~ server1, 'no retransmit']

    - name: Replaced - idempotent
      register: result
      cisco.ios.ios_radius_global: *replace

    - name: Replaced - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
