---
- ansible.builtin.debug:
    msg: START Merged ios_route_maps state for integration tests on connection={{ ansible_connection }}

- block:
    - ansible.builtin.include_tasks: _remove_config.yaml
    - name: Merge provided route maps configuration with device configuration
      register: result
      cisco.ios.ios_route_maps: &id001
        config:
          - route_map: test_1
            entries:
              - sequence: 10
                action: deny
                description: this is test route
                set:
                  as_path:
                    prepend:
                      as_number:
                        - 64512
                  community:
                    number: 65000:100 65000:200
                match:
                  community:
                    name:
                      - test_comm
                  ip:
                    next_hop:
                      prefix_lists:
                        - test_1_new
                        - test_2_new
                    route_source:
                      acls:
                        - 10
                  security_group:
                    source:
                      - 10
                      - 20
                  local_preference:
                    value:
                      - 50
                      - 100
                  mpls_label: true
              - sequence: 20
                action: deny
                continue_entry:
                  entry_sequence: 100
                match:
                  additional_paths:
                    all: true
                    group_best: true
                  as_path:
                    acls:
                      - 100
                      - 200
                  ipv6:
                    address:
                      acl: test_acl_20
                  route_type:
                    level_1: true
                  tag:
                    tag_list:
                      - test_match_tag
                  track: 105
          - route_map: test_2
            entries:
              - sequence: 10
                action: deny
                match:
                  ipv6:
                    address:
                      acl: test_ip_acl
                    next_hop:
                      prefix_list: test_new
                    route_source:
                      acl: route_src_acl
                  security_group:
                    source:
                      - 10
                      - 20
                  local_preference:
                    value:
                      - 55
                      - 105
                  mpls_label: true
                set:
                  aigp_metric:
                    value: 100
                  as_path:
                    prepend:
                      as_number:
                        - 65111
                        - 65111
                  automatic_tag: true
                  extcommunity:
                    cost:
                      id: 10
                      cost_value: 100
                      pre_bestpath: true
                  ip:
                    address: 192.0.2.1
                    df: 1
                    next_hop:
                      recursive:
                        global_route: true
                        address: 198.51.110.1
                      verify_availability:
                        address: 198.51.111.1
                        sequence: 100
                        track: 10
                    precedence:
                      critical: true
        state: merged

    - name: Assert that correct set of commands were generated
      ansible.builtin.assert:
        that:
          - "{{ merged['commands'] | symmetric_difference(result['commands']) | length == 0 }}"

    - name: Assert that before dicts are correctly generated
      ansible.builtin.assert:
        that:
          - merged['before'] == {}

    - name: debug
      debug:
        msg: "{{ merged['after'] | symmetric_difference(result['after']) }}"
    - name: Assert that after dict is correctly generated
      ansible.builtin.assert:
        that:
          - "{{ merged['after'] | symmetric_difference(result['after']) | length == 0 }}"

    - name: Merge provided route maps configuration with device configuration (idempotent)
      register: result
      cisco.ios.ios_route_maps: *id001
    - name: Assert that the previous task was idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml

# Regression test: bare entries (action+sequence only) must be applied
- block:
    - ansible.builtin.include_tasks: _remove_config.yaml
    - name: Merge bare route-map entries (action+sequence only, no sub-commands)
      register: result
      cisco.ios.ios_route_maps: &id_bare
        config:
          - route_map: BARE_TEST
            entries:
              - action: deny
                sequence: 6
              - action: permit
                sequence: 10
        state: merged

    - name: Assert that bare entries generated the route-map header commands
      ansible.builtin.assert:
        that:
          - "{{ merged_bare['commands'] | symmetric_difference(result['commands']) | length == 0 }}"
          - result['changed'] == true

    - name: Merge bare entries again (idempotency check)
      register: result
      cisco.ios.ios_route_maps: *id_bare
    - name: Assert that bare entries are idempotent
      ansible.builtin.assert:
        that:
          - result['changed'] == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml

# Regression test: continue_entry.set=true must emit bare "continue" command
- block:
    - ansible.builtin.include_tasks: _remove_config.yaml

    - name: Merge continue_entry.set=true — bare continue must be generated
      register: result
      cisco.ios.ios_route_maps: &id_continue
        config:
          - route_map: TEST_CONTINUE_ENTRY
            entries:
              - sequence: 10
                action: permit
                continue_entry:
                  set: true
                description: Test bare continue
        state: merged

    - name: Assert bare continue command generated
      ansible.builtin.assert:
        that:
          - result['changed'] == true
          - "'continue' in result['commands']"

    - name: Merge continue_entry.set=true again (idempotency)
      register: result
      cisco.ios.ios_route_maps: *id_continue

    - name: Assert idempotent with bare continue
      ansible.builtin.assert:
        that:
          - result['changed'] == false

    - name: Merge continue_entry.entry_sequence=20 — must generate "continue 20"
      register: result
      cisco.ios.ios_route_maps:
        config:
          - route_map: TEST_CONTINUE_ENTRY
            entries:
              - sequence: 10
                action: permit
                continue_entry:
                  entry_sequence: 20
                description: Test bare continue
        state: merged

    - name: Assert continue 20 generated
      ansible.builtin.assert:
        that:
          - result['changed'] == true
          - "'continue 20' in result['commands']"

  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
