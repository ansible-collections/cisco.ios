service dhcp
ip http server
ip http authentication aaa login-authentication WEB-LOGIN
ip http access-class ipv4 HTTP-CLIENTS
ip http access-class ipv6 HTTP-V6
ip http port 8080
ip http secure-server
ip http secure-port 443
ip http max-connections 300
ip http secure-trustpoint LAB-TP
ip http client source-interface GigabitEthernet0/0
ip http client secure-trustpoint LAB-CA
ip http timeout-policy idle 180 life 180 requests 25
