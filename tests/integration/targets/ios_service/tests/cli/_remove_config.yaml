---
- name: Switch the ip services of the tests off and remove the source interfaces
  cisco.ios.ios_config:
    lines:
      - no ip finger
      - no ip bootp server
      - no ip rcmd rsh-enable
      - no ip rcmd rcp-enable
      - no ip tftp source-interface
      - no ip ftp source-interface

- name: Remove the interface of the tests
  cisco.ios.ios_interfaces:
    config:
      - name: "{{ source_interface }}"
    state: purged
