---
- ansible.builtin.debug:
    msg: START ios_service gathered integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _prepare.yaml
- block:
    - name: Gathered - prepare
      cisco.ios.ios_service:
        config:
          ip:
            finger: true
            rcmd:
              rcp_enable: true
            ftp:
              source_interface: "{{ source_interface }}"
        state: merged

    - name: Gathered - read the configuration
      register: result
      cisco.ios.ios_service:
        state: gathered

    - name: Gathered - assert
      ansible.builtin.assert:
        that:
          - result.changed == false
          - result.gathered.ip.finger == true
          - result.gathered.ip.rcmd.rcp_enable == true
          - result.gathered.ip.ftp.source_interface == source_interface
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
