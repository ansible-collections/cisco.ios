---
- ansible.builtin.debug:
    msg: START ios_service merged integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _prepare.yaml
- block:
    - name: Merged - the legacy services on, the source interfaces
      register: result
      cisco.ios.ios_service: &create
        config:
          ip:
            finger: true
            bootp_server: true
            rcmd:
              rsh_enable: true
            tftp:
              source_interface: "{{ source_interface }}"
            ftp:
              source_interface: "{{ source_interface }}"
        state: merged

    - name: Merged - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'ip finger' in result.commands"
          - "'ip bootp server' in result.commands"
          - "'ip rcmd rsh-enable' in result.commands"
          - "'ip tftp source-interface ' ~ source_interface in result.commands"
          - "'ip ftp source-interface ' ~ source_interface in result.commands"

    - name: Merged - idempotent
      register: result
      cisco.ios.ios_service: *create

    - name: Merged - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false

    - name: Merged - false turns a service off
      register: result
      cisco.ios.ios_service:
        config:
          ip:
            finger: false
            bootp_server: false
        state: merged

    - name: Merged - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no ip finger' in result.commands"
          - "'no ip bootp server' in result.commands"
          - "'ip rcmd rsh-enable' not in result.commands"

    - name: Merged - false on what is already off
      register: result
      cisco.ios.ios_service:
        config:
          ip:
            finger: false
            bootp_server: false
        state: merged

    - name: Merged - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
