---
- ansible.builtin.debug:
    msg: START ios_service replaced integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _prepare.yaml
- block:
    - name: Replaced - prepare, the services of the test on
      cisco.ios.ios_service:
        config:
          ip:
            finger: true
            rcmd:
              rsh_enable: true
            tftp:
              source_interface: "{{ source_interface }}"
        state: merged

    - name: Replaced - the ip section is cut down to the task, the service options of the device are sent back
      register: result
      cisco.ios.ios_service: &replace
        config: "{{ service_options | combine({'ip': {'bootp_server': true}}) }}"
        state: replaced

    - name: Replaced - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'ip bootp server' in result.commands"
          - "'no ip finger' in result.commands"
          - "'no ip rcmd rsh-enable' in result.commands"
          - "'no ip tftp source-interface' in result.commands"
          - result.commands | select('match', '^(no )?service') | list | length == 0

    - name: Replaced - idempotent
      register: result
      cisco.ios.ios_service: *replace

    - name: Replaced - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
