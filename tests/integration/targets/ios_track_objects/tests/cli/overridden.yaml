---
- ansible.builtin.debug:
    msg: START ios_track_objects overridden integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Overridden - keep only object 91
      register: result
      cisco.ios.ios_track_objects: &override
        config:
          - object_id: 91
            ip_sla:
              operation_id: 91
              parameter: state
            delay:
              down: 120
              up: 180
        state: overridden

    - name: Overridden - assert the other objects are gone
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no track 92' in result.commands"
          - "'no track 99' in result.commands"
          - result.after | length == 1

    - name: Overridden - idempotent
      register: result
      cisco.ios.ios_track_objects: *override

    - name: Overridden - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
