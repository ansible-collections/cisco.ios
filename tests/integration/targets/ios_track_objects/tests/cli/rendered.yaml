---
- ansible.builtin.debug:
    msg: START ios_track_objects rendered integration tests on connection={{ ansible_connection }}

- name: Rendered - render commands without device
  register: result
  cisco.ios.ios_track_objects:
    config:
      - object_id: 93
        interface:
          name: "{{ track_if_long }}"
          parameter: line_protocol
    state: rendered

- name: Rendered - assert commands generated
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.rendered == ['track 93 interface ' ~ track_if_long ~ ' line-protocol']
