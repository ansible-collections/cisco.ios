---
- ansible.builtin.debug:
    msg: START ios_tunnel_interfaces deleted integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Deleted - one interface
      register: result
      cisco.ios.ios_tunnel_interfaces:
        config:
          - name: "{{ tunnel1 }}"
        state: deleted

    - name: Deleted - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands[0] == 'interface ' ~ tunnel1
          - "'no tunnel key' in result.commands"

    - name: Deleted - everything
      cisco.ios.ios_tunnel_interfaces:
        state: deleted

    - name: Deleted - idempotent
      register: result
      cisco.ios.ios_tunnel_interfaces:
        state: deleted

    - name: Deleted - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
