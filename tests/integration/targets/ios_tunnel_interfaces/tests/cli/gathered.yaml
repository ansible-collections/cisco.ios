---
- ansible.builtin.debug:
    msg: START ios_tunnel_interfaces gathered integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Gathered - read the configuration
      register: result
      cisco.ios.ios_tunnel_interfaces:
        state: gathered

    - name: Gathered - assert
      ansible.builtin.assert:
        that:
          - result.changed == false
          - (result.gathered | selectattr('name', 'equalto', tunnel1) | first).key == 1501
          - (result.gathered | selectattr('name', 'equalto', tunnel2) | first).destination == tunnel_dst2
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
