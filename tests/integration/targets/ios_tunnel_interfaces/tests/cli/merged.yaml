---
- ansible.builtin.debug:
    msg: START ios_tunnel_interfaces merged integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- block:
    - name: Merged - create
      register: result
      cisco.ios.ios_tunnel_interfaces: &create
        config:
          - name: "{{ tunnel1 }}"
            source: "{{ tunnel_src }}"
            destination: "{{ tunnel_dst1 }}"
            key: 1501
            ttl: 64
            checksum: true
        state: merged

    - name: Merged - assert changed
      ansible.builtin.assert:
        that:
          - result.changed == true
          - result.commands[0] == 'interface ' ~ tunnel1
          - "'tunnel source ' ~ tunnel_src in result.commands"
          - "'tunnel destination ' ~ tunnel_dst1 in result.commands"
          - "'tunnel key 1501' in result.commands"
          - "'tunnel ttl 64' in result.commands"
          - "'tunnel checksum' in result.commands"

    - name: Merged - idempotent
      register: result
      cisco.ios.ios_tunnel_interfaces: *create

    - name: Merged - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false

    - name: Merged - the defaults are not printed by IOS, setting them is idempotent
      register: result
      cisco.ios.ios_tunnel_interfaces:
        config:
          - name: "Tu1501"
            mode: gre_ip
            ttl: 64
        state: merged

    - name: Merged - assert idempotent with defaults and a short name
      ansible.builtin.assert:
        that:
          - result.changed == false

    - name: Merged - only the key, everything else is kept
      register: result
      cisco.ios.ios_tunnel_interfaces:
        config:
          - name: "{{ tunnel1 }}"
            key: 99
        state: merged

    - name: Merged - assert
      ansible.builtin.assert:
        that:
          - result.commands == ['interface ' ~ tunnel1, 'tunnel key 99']
          - result.after[0].destination == tunnel_dst1
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
