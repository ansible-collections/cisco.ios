---
- ansible.builtin.debug:
    msg: START ios_tunnel_interfaces parsed integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- name: Parsed - parse config string
  register: result
  cisco.ios.ios_tunnel_interfaces:
    running_config: "{{ lookup('file', role_path + '/tests/cli/_parsed.cfg') }}"
    state: parsed

- name: Parsed - assert structured data returned
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.parsed | length == 2
      - result.parsed[0].tunnel_vrf == "MGMT"
      - result.parsed[1].mode == "gre_ipv6"
      - result.parsed[1].checksum == true
