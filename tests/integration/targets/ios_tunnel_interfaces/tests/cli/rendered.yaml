---
- ansible.builtin.debug:
    msg: START ios_tunnel_interfaces rendered integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- name: Rendered - render commands without device
  register: result
  cisco.ios.ios_tunnel_interfaces:
    config:
      - name: "{{ tunnel1 }}"
        mode: gre_multipoint
        source: "{{ tunnel_src }}"
        key: 7
    state: rendered

- name: Rendered - assert commands generated
  ansible.builtin.assert:
    that:
      - result.changed == false
      - result.rendered == ['interface ' ~ tunnel1, 'tunnel mode gre multipoint', 'tunnel source ' ~ tunnel_src, 'tunnel key 7']
