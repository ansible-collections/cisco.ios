---
- ansible.builtin.debug:
    msg: START ios_tunnel_interfaces replaced integration tests on connection={{ ansible_connection }}

- ansible.builtin.include_tasks: _remove_config.yaml
- ansible.builtin.include_tasks: _populate_config.yaml

- block:
    - name: Replaced - drop the key, new destination
      register: result
      cisco.ios.ios_tunnel_interfaces: &replace
        config:
          - name: "{{ tunnel1 }}"
            source: "{{ tunnel_src }}"
            destination: "{{ tunnel_dst2 }}"
        state: replaced

    - name: Replaced - assert
      ansible.builtin.assert:
        that:
          - result.changed == true
          - "'no tunnel key' in result.commands"
          - "'tunnel destination ' ~ tunnel_dst2 in result.commands"

    - name: Replaced - idempotent
      register: result
      cisco.ios.ios_tunnel_interfaces: *replace

    - name: Replaced - assert idempotent
      ansible.builtin.assert:
        that:
          - result.changed == false

    - name: Replaced - the other tunnel is left alone
      cisco.ios.ios_tunnel_interfaces:
        state: gathered
      register: result

    - name: Replaced - assert the other tunnel is untouched
      ansible.builtin.assert:
        that:
          - (result.gathered | selectattr('name', 'equalto', tunnel2) | first).ttl == 64
  always:
    - ansible.builtin.include_tasks: _remove_config.yaml
